<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Silver Metallic Chrome Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#D1D5DB" />
      <stop offset="55%" stop-color="#9CA3AF" />
      <stop offset="75%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>

    <!-- Luxury Gold Gradient for "E" -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="75%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Shadow for 3D depth -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#dropGlow)">
    <!-- Aerodynamic Sports Car Profile / Silhouette -->
    <!-- Roofline, Windshield, Hood & Rear Spoiler -->
    <path 
      d="M 68 250 C 120 215, 175 195, 230 155 C 275 125, 335 125, 375 158 C 415 192, 450 205, 465 210 C 430 218, 385 220, 350 200 C 315 180, 275 175, 235 195 C 170 230, 115 258, 68 250 Z" 
      fill="url(#chromeGrad)" 
    />
    <!-- Lower Body Sweep Line & Fender Accents -->
    <path 
      d="M 125 240 C 160 220, 205 210, 255 210 C 310 210, 360 225, 395 245 C 365 242, 330 235, 280 232 C 220 228, 175 235, 125 240 Z" 
      fill="url(#chromeGrad)" 
    />
    <path 
      d="M 345 220 C 375 215, 410 220, 440 235 C 415 238, 385 232, 345 220 Z" 
      fill="url(#chromeGrad)" 
    />

    <!-- Headlight / Gold Wingtip Accent -->
    <polygon points="68,250 92,238 98,248" fill="url(#goldGrad)" />

    <!-- "PAK E DRIVE" Typography -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-style="italic">
      <!-- "PAK" in Silver Chrome -->
      <text x="75" y="325" font-size="64" fill="url(#chromeGrad)" letter-spacing="2">PAK</text>
      
      <!-- "E" in 3D Gold Accent -->
      <text x="215" y="325" font-size="68" fill="url(#goldGrad)" font-weight="950">E</text>
      
      <!-- "DRIVE" in Silver Chrome -->
      <text x="272" y="325" font-size="64" fill="url(#chromeGrad)" letter-spacing="2">DRIVE</text>
    </g>

    <!-- Horizontal Lines and "RENT A CAR" -->
    <!-- Left Accent Line -->
    <rect x="75" y="358" width="60" height="4" rx="2" fill="url(#chromeGrad)" />
    
    <!-- Subtitle "RENT A CAR" -->
    <text 
      x="256" 
      y="366" 
      font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" 
      font-size="21" 
      font-weight="800" 
      letter-spacing="9" 
      text-anchor="middle" 
      fill="url(#chromeGrad)"
    >
      RENT A CAR
    </text>
    
    <!-- Right Accent Line -->
    <rect x="377" y="358" width="60" height="4" rx="2" fill="url(#chromeGrad)" />
  </g>
</svg>
