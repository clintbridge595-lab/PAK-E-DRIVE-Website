<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich 3D Chrome Gradients -->
    <linearGradient id="chromeMain" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#94A3B8" />
      <stop offset="55%" stop-color="#475569" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="chromeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Luxury 3D Gold Gradients -->
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="20%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="65%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Floating Effect without black box -->
    <filter id="soft3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#soft3D)">
    <!-- 1. SLEEK SPORTS CAR SILHOUETTE (Top Emblem) -->
    <!-- Main Sweeping Aerodynamic Roofline & Fastback -->
    <path 
      d="M 72 230 
         C 105 198, 150 178, 205 142 
         C 248 114, 305 112, 342 138 
         C 382 166, 420 182, 452 188 
         C 418 194, 375 194, 340 176 
         C 305 158, 262 154, 222 174 
         C 160 205, 110 236, 72 230 Z" 
      fill="url(#chromeMain)" 
    />

    <!-- Middle Waistline / Character Contour Line -->
    <path 
      d="M 132 222 
         C 168 204, 215 194, 265 194 
         C 318 194, 365 208, 400 228 
         C 368 224, 332 216, 282 214 
         C 222 210, 180 216, 132 222 Z" 
      fill="url(#chromeMain)" 
    />

    <!-- Rear Fender / Diffuser Sweep -->
    <path 
      d="M 338 206 
         C 368 200, 404 204, 436 218 
         C 410 222, 380 216, 338 206 Z" 
      fill="url(#chromeDark)" 
    />

    <!-- Front Headlight / Splitter Amber-Gold Winglet -->
    <path 
      d="M 72 230 
         L 98 218 
         C 102 226, 100 230, 94 233 
         Z" 
      fill="url(#goldMain)" 
    />

    <!-- 2. TYPOGRAPHY: PAK E DRIVE -->
    <!-- Shadow / Under-bevel layer for typography -->
    <g transform="translate(0, 3)" opacity="0.3">
      <text x="68" y="322" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-style="italic" font-size="70" letter-spacing="1" fill="#000000">PAK</text>
      <text x="220" y="322" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-style="italic" font-size="74" fill="#000000">E</text>
      <text x="276" y="322" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-style="italic" font-size="70" letter-spacing="1" fill="#000000">DRIVE</text>
    </g>

    <!-- Main Front Face of Typography -->
    <!-- "PAK" in 3D Polished Chrome -->
    <text x="68" y="320" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-style="italic" font-size="70" letter-spacing="1" fill="url(#chromeMain)">PAK</text>

    <!-- "E" in Luxury Radiant 3D Gold -->
    <text x="220" y="320" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-style="italic" font-size="74" fill="url(#goldMain)">E</text>

    <!-- "DRIVE" in 3D Polished Chrome -->
    <text x="276" y="320" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-style="italic" font-size="70" letter-spacing="1" fill="url(#chromeMain)">DRIVE</text>

    <!-- 3. SUBTITLE: "RENT A CAR" with Sleek Metallic Accent Rules -->
    <!-- Left Accent Line -->
    <rect x="70" y="358" width="65" height="4.5" rx="2.2" fill="url(#chromeMain)" />

    <!-- Subtitle Text -->
    <text 
      x="256" 
      y="366" 
      font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" 
      font-size="22" 
      font-weight="800" 
      letter-spacing="9" 
      text-anchor="middle" 
      fill="url(#chromeMain)"
    >
      RENT A CAR
    </text>

    <!-- Right Accent Line -->
    <rect x="377" y="358" width="65" height="4.5" rx="2.2" fill="url(#chromeMain)" />
  </g>
</svg>