<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PAK E DRIVE - Car Plate Blackout Calibrator</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 20px; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 12px; border: 1px solid #333; }
    .img-wrap { position: relative; width: 100%; overflow: hidden; background: #000; border-radius: 4px; }
    .img-wrap img { width: 100%; display: block; }
    .plate-box {
      position: absolute;
      background: #0d0d0d;
      border: 1px solid #222;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      border-radius: 4px;
      pointer-events: none;
    }
    .inputs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 12px; }
    .inputs label { display: flex; flex-direction: column; }
    .inputs input { width: 60px; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 4px; }
    .no-plate { opacity: 0.6; }
  </style>
</head>
<body>
  <h1>PAK E DRIVE - Car Plate Blackout Calibrator</h1>
  <div id="carsGrid" class="grid"></div>
  <script>
    fetch('/src/data/plateCoordinates.json')
      .then(r => r.json())
      .then(data => {
        const grid = document.getElementById('carsGrid');
        for (const [file, box] of Object.entries(data)) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>${file}</h3>
            <div class="img-wrap" id="wrap-${file}">
              <img src="/cars_backup/${file}" id="img-${file}">
            </div>
            <div class="inputs">
              <label>X: <input type="number" value="${box.x}" id="x-${file}"></label>
              <label>Y: <input type="number" value="${box.y}" id="y-${file}"></label>
              <label>W: <input type="number" value="${box.w}" id="w-${file}"></label>
              <label>H: <input type="number" value="${box.h}" id="h-${file}"></label>
              <label>Disabled: <input type="checkbox" ${box.disabled ? 'checked' : ''} id="dis-${file}"></label>
            </div>
          `;
          grid.appendChild(card);
        }
      });
  </script>
</body>
</html>
